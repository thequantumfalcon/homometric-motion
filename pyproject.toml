[build-system]
requires = ["setuptools==84.2.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homometric-motion"
version = "0.1.0"
description = "An exact-arithmetic conditional certificate for motion-based homometric discrimination"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "The Quantum Falcon" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/thequantumfalcon/homometric-motion"
Issues = "https://github.com/thequantumfalcon/homometric-motion/issues"
Discussions = "https://github.com/thequantumfalcon/homometric-motion/discussions"

[project.scripts]
homometric-motion = "homometric_motion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
homometric_motion = ["inputs.json", "protocol.json", "source_manifest.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["homometric_motion"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_also = ["if __name__ == .__main__.:"]
