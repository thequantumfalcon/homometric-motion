version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      development-tools:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /review
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: pip
    directory: /studies/finite-motion
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
