name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/project.py setup
      - run: python tools/project.py release
  prototype:
    name: prototype (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python tools/project.py setup
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r prototype/requirements.txt
      - run: python tools/project.py prototype
  finite_motion:
    name: finite-motion (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python tools/project.py setup
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r studies/finite-motion/requirements.txt
      - run: python tools/project.py finite-motion
  lean:
    name: lean
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python tools/project.py setup
      - run: python tools/project.py lean-setup
      - run: python tools/project.py lean
  hooks:
    name: hooks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - run: python tools/project.py setup
      - run: python tools/project.py hooks
      - run: python -m pre_commit run gitleaks-history --hook-stage manual --all-files
      - run: python tools/check_commits.py
        env:
          COMMIT_POLICY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
  fuzz:
    name: fuzz (Linux, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python tools/project.py setup
      - run: python tools/project.py fuzz
      - name: Preserve failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-inputs
          path: |
            .build/artifact-*/crash-*
            .build/artifact-*/timeout-*
            .build/artifact-*/oom-*
            .build/artifact-*/leak-*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  ci:
    name: ci
    needs: [test, hooks, prototype, finite_motion, fuzz, lean]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          HOOK_RESULT: ${{ needs.hooks.result }}
          PROTOTYPE_RESULT: ${{ needs.prototype.result }}
          FINITE_MOTION_RESULT: ${{ needs.finite_motion.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          LEAN_RESULT: ${{ needs.lean.result }}
        run: >-
          test "$TEST_RESULT" = success && test "$HOOK_RESULT" = success &&
          test "$PROTOTYPE_RESULT" = success && test "$FINITE_MOTION_RESULT" = success &&
          test "$FUZZ_RESULT" = success && test "$LEAN_RESULT" = success
